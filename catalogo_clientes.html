<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheTopCaps — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --black:#0a0a0a;
    --white:#fafafa;
    --gray1:#1a1a1a;
    --gray2:#2a2a2a;
    --gray3:#444;
    --gray4:#888;
    --gray5:#bbb;
    --gray6:#e5e5e5;
    --border:rgba(255,255,255,0.08);
    --border2:rgba(255,255,255,0.15);
  }

  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--black);
    color:var(--white);
    min-height:100vh;
  }

  /* HEADER */
  .site-header{
    position:sticky;top:0;z-index:100;
    background:rgba(10,10,10,0.95);
    border-bottom:0.5px solid var(--border2);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
  }
  .header-inner{
    max-width:1280px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:0.75rem 1.5rem;gap:1rem;
  }
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
  .brand-logo{
    width:44px;height:44px;border-radius:50%;
    object-fit:cover;border:1.5px solid var(--border2);
  }
  .brand-name{
    font-family:'Bebas Neue',sans-serif;
    font-size:22px;letter-spacing:2px;color:var(--white);
  }

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .search-wrap{position:relative;flex:1;min-width:160px}
  .search-wrap input{
    width:100%;padding:8px 12px 8px 34px;
    background:var(--gray1);border:0.5px solid var(--border2);
    border-radius:8px;color:var(--white);font-size:13px;
    font-family:'Inter',sans-serif;outline:none;
    transition:border-color 0.15s;
  }
  .search-wrap input:focus{border-color:var(--white)}
  .search-wrap input::placeholder{color:var(--gray4)}
  .search-icon{
    position:absolute;left:10px;top:50%;
    transform:translateY(-50%);color:var(--gray4);font-size:13px;pointer-events:none
  }
  .hdr-select{
    padding:8px 12px;background:var(--gray1);
    border:0.5px solid var(--border2);border-radius:8px;
    color:var(--white);font-size:13px;cursor:pointer;outline:none;
    font-family:'Inter',sans-serif;
  }

  /* HERO */
  .hero{
    max-width:1280px;margin:0 auto;
    padding:4rem 1.5rem 2rem;
    display:flex;align-items:center;gap:2rem;flex-wrap:wrap;
  }
  .hero-logo{
    width:90px;height:90px;border-radius:50%;
    object-fit:cover;border:2px solid var(--border2);
    flex-shrink:0;
  }
  .hero-text h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(2.5rem,6vw,4.5rem);
    letter-spacing:4px;line-height:1;
    color:var(--white);
  }
  .hero-text p{font-size:14px;color:var(--gray4);margin-top:8px;letter-spacing:1px;text-transform:uppercase}

  .divider{
    max-width:1280px;margin:0 auto 2rem;
    padding:0 1.5rem;
  }
  .divider hr{border:none;border-top:0.5px solid var(--border2)}

  /* FILTERS ROW */
  .filters{
    max-width:1280px;margin:0 auto 1.5rem;padding:0 1.5rem;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .filter-chip{
    padding:6px 14px;border:0.5px solid var(--border2);
    border-radius:20px;background:transparent;
    color:var(--gray4);font-size:12px;font-family:'Inter',sans-serif;
    cursor:pointer;transition:all 0.15s;letter-spacing:0.5px;text-transform:uppercase;
  }
  .filter-chip:hover{border-color:var(--white);color:var(--white)}
  .filter-chip.active{background:var(--white);color:var(--black);border-color:var(--white)}

  /* STATS */
  .stats-row{
    max-width:1280px;margin:0 auto 2.5rem;padding:0 1.5rem;
    display:flex;gap:24px;flex-wrap:wrap;
  }
  .stat-item{font-size:13px;color:var(--gray4)}
  .stat-item span{color:var(--white);font-weight:600}

  /* GRID */
  .products-section{max-width:1280px;margin:0 auto;padding:0 1.5rem 4rem}
  .products-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:1px;
    background:var(--border);
    border:0.5px solid var(--border);
    border-radius:2px;
  }

  .product-card{
    background:var(--black);
    cursor:pointer;
    transition:background 0.15s;
    position:relative;
    overflow:hidden;
  }
  .product-card:hover{background:var(--gray1)}
  .product-card.out-of-stock{opacity:0.5}

  .card-img-wrap{
    width:100%;aspect-ratio:1/1;
    background:var(--gray1);
    overflow:hidden;position:relative;
  }
  .card-img-wrap img{
    width:100%;height:100%;
    object-fit:cover;
    transition:transform 0.4s ease;
  }
  .product-card:hover .card-img-wrap img{transform:scale(1.04)}
  .card-img-placeholder{
    width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;color:var(--gray3);font-size:12px;letter-spacing:1px;text-transform:uppercase;
  }
  .card-img-placeholder .no-img-icon{font-size:28px;opacity:0.3}
  .card-img-placeholder span{font-size:10px;color:var(--gray4)}

  .badge-out{
    position:absolute;top:10px;left:10px;
    background:rgba(10,10,10,0.9);
    color:var(--gray4);
    font-size:10px;letter-spacing:1px;text-transform:uppercase;
    padding:4px 8px;border-radius:2px;border:0.5px solid var(--gray3);
  }
  .badge-low{
    position:absolute;top:10px;left:10px;
    background:rgba(10,10,10,0.9);
    color:#c8a535;
    font-size:10px;letter-spacing:1px;text-transform:uppercase;
    padding:4px 8px;border-radius:2px;border:0.5px solid #c8a535;
  }

  .card-info{padding:1rem}
  .card-category{
    font-size:10px;letter-spacing:2px;text-transform:uppercase;
    color:var(--gray4);margin-bottom:6px;
  }
  .card-name{
    font-family:'Bebas Neue',sans-serif;
    font-size:18px;letter-spacing:1px;
    color:var(--white);margin-bottom:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card-desc{
    font-size:12px;color:var(--gray4);
    margin-bottom:10px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:14px;line-height:1.5;
  }
  .card-footer{
    display:flex;justify-content:space-between;align-items:center;
  }
  .card-price{
    font-family:'Bebas Neue',sans-serif;
    font-size:20px;letter-spacing:1px;color:var(--white);
  }
  .card-stock-label{
    font-size:11px;color:var(--gray4);letter-spacing:0.5px;
  }

  /* EMPTY */
  .empty{
    text-align:center;padding:5rem 1rem;color:var(--gray4);
    grid-column:1/-1;
  }
  .empty-icon{font-size:48px;margin-bottom:12px;opacity:0.2}
  .empty h3{
    font-family:'Bebas Neue',sans-serif;
    font-size:24px;letter-spacing:2px;margin-bottom:6px;
  }

  /* MODAL */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.85);
    display:none;align-items:center;justify-content:center;
    z-index:200;padding:1rem;
    backdrop-filter:blur(8px);
  }
  .modal-overlay.open{display:flex}
  .modal{
    background:var(--gray1);
    border:0.5px solid var(--border2);
    border-radius:4px;
    width:100%;max-width:520px;
    max-height:90vh;overflow-y:auto;
  }
  .modal-img{
    width:100%;aspect-ratio:1/1;background:var(--gray2);
    overflow:hidden;position:relative;
  }
  .modal-img img{width:100%;height:100%;object-fit:cover}
  .modal-img-placeholder{
    width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--gray3);gap:8px;font-size:12px;letter-spacing:1px;text-transform:uppercase;
  }
  .modal-img-placeholder .mpi{font-size:36px;opacity:0.3}
  .btn-close-modal{
    position:absolute;top:12px;right:12px;
    background:rgba(10,10,10,0.8);border:0.5px solid var(--border2);
    color:var(--white);border-radius:50%;
    width:32px;height:32px;cursor:pointer;font-size:18px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .modal-body{padding:1.5rem}
  .modal-cat{
    font-size:11px;letter-spacing:2px;text-transform:uppercase;
    color:var(--gray4);margin-bottom:8px;
  }
  .modal-name{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(1.8rem,5vw,2.5rem);letter-spacing:2px;
    color:var(--white);margin-bottom:12px;line-height:1;
  }
  .modal-desc{
    font-size:14px;color:var(--gray4);line-height:1.7;margin-bottom:16px;
  }
  .modal-price{
    font-family:'Bebas Neue',sans-serif;
    font-size:2rem;letter-spacing:1px;color:var(--white);margin-bottom:4px;
  }
  .modal-stock{font-size:12px;color:var(--gray4);letter-spacing:0.5px}
  .modal-divider{
    border:none;border-top:0.5px solid var(--border2);margin:16px 0;
  }
  .modal-sku{font-size:11px;color:var(--gray3);letter-spacing:1px;font-family:monospace}
  .modal-location{font-size:12px;color:var(--gray4);margin-top:4px}

  /* FOOTER */
  .site-footer{
    border-top:0.5px solid var(--border2);
    text-align:center;padding:2rem 1rem;
    color:var(--gray3);font-size:12px;letter-spacing:1px;
    text-transform:uppercase;
  }
  .footer-logo{
    width:32px;height:32px;border-radius:50%;
    object-fit:cover;margin:0 auto 8px;opacity:0.5;display:block;
  }

  /* LOADING */
  #loadingScreen{
    position:fixed;inset:0;background:var(--black);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;z-index:999;
  }
  .spinner{
    width:28px;height:28px;border:2px solid var(--gray2);
    border-top-color:var(--white);border-radius:50%;
    animation:spin 0.7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-logo{width:56px;height:56px;border-radius:50%;object-fit:cover;opacity:0.6}
  .loading-text{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gray4)}

  @media(max-width:600px){
    .products-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
    .header-inner{padding:0.75rem 1rem}
    .hero{padding:2rem 1rem 1.5rem}
    .filters,.stats-row,.products-section,.divider{padding-left:1rem;padding-right:1rem}
  }
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCvtGxuPmGX9YmYYOq0AfGL5OjUPIu1-Dc",
  authDomain:"inventario-thetopcaps.firebaseapp.com",
  projectId:"inventario-thetopcaps",
  storageBucket:"inventario-thetopcaps.firebasestorage.app",
  messagingSenderId:"933411080401",
  appId:"1:933411080401:web:124dc83e4d505db86addf0"
});
const db = firebase.firestore();

let allProducts = [];
let activeCat = '';

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

db.collection('productos').orderBy('createdAt','desc').onSnapshot(snap=>{
  allProducts = snap.docs.map(d=>({id:d.id,...d.data()}));
  buildCatFilters();
  filterProducts();
  document.getElementById('loadingScreen').style.display='none';
},()=>{
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('productsGrid').innerHTML=
    '<div class="empty"><div class="empty-icon">📶</div><h3>Sin conexión</h3><p>Verifica tu internet</p></div>';
});

function buildCatFilters(){
  const cats=[...new Set(allProducts.map(p=>p.category).filter(Boolean))].sort();
  const row=document.getElementById('filtersRow');
  row.innerHTML='<button class="filter-chip active" data-cat="" onclick="setCat(this)">Todo</button>';
  cats.forEach(c=>{
    const b=document.createElement('button');
    b.className='filter-chip';
    b.dataset.cat=c;
    b.textContent=c;
    b.onclick=function(){setCat(this)};
    row.appendChild(b);
  });
}

function setCat(btn){
  activeCat=btn.dataset.cat;
  document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filterProducts();
}

function filterProducts(){
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  const sort=document.getElementById('sortSelect').value;
  let list=allProducts.filter(p=>{
    const ok=p.stock>0||!p.stock;
    const mq=!q||p.name.toLowerCase().includes(q)||(p.description||'').toLowerCase().includes(q)||(p.sku||'').toLowerCase().includes(q);
    const mc=!activeCat||p.category===activeCat;
    return mq&&mc;
  });
  if(sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
  if(sort==='price-hi') list.sort((a,b)=>(parseFloat(b.price)||0)-(parseFloat(a.price)||0));
  if(sort==='price-lo') list.sort((a,b)=>(parseFloat(a.price)||0)-(parseFloat(b.price)||0));
  renderGrid(list);
  document.getElementById('statTotal').textContent=allProducts.length;
  document.getElementById('statAvail').textContent=allProducts.filter(p=>p.stock>0).length;
}

function renderGrid(list){
  const grid=document.getElementById('productsGrid');
  if(!list.length){
    grid.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><h3>Sin resultados</h3><p style="font-size:13px;margin-top:4px">Prueba con otra búsqueda o categoría</p></div>';
    return;
  }
  grid.innerHTML=list.map(p=>{
    const isOut=!p.stock||p.stock==0;
    const isLow=p.stock>0&&p.stock<=(p.minStock||5);
    const badge=isOut?'<div class="badge-out">Agotado</div>':isLow?'<div class="badge-low">Últimas piezas</div>':'';
    const imgHtml=p.image
      ?`<img src="${p.image}" alt="${esc(p.name)}" loading="lazy">`
      :`<div class="card-img-placeholder"><div class="no-img-icon">🖼️</div><span>Sin foto</span></div>`;
    return `<div class="product-card${isOut?' out-of-stock':''}" onclick="openModal('${p.id}')">
      <div class="card-img-wrap">${imgHtml}${badge}</div>
      <div class="card-info">
        <div class="card-category">${p.category?esc(p.category):'&nbsp;'}</div>
        <div class="card-name">${esc(p.name)}</div>
        <div class="card-desc">${p.description?esc(p.description):'&nbsp;'}</div>
        <div class="card-footer">
          <div class="card-price">$${parseFloat(p.price||0).toLocaleString('es-MX',{minimumFractionDigits:2})}</div>
          <div class="card-stock-label">${isOut?'Agotado':isLow?p.stock+' disp.':''}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openModal(id){
  const p=allProducts.find(x=>x.id===id);if(!p)return;
  const wrap=document.getElementById('modalImgWrap');
  const closeBtn='<button class="btn-close-modal" onclick="closeModal()">×</button>';
  if(p.image){
    wrap.innerHTML=`<img src="${p.image}" alt="${esc(p.name)}" style="width:100%;height:100%;object-fit:cover">${closeBtn}`;
  }else{
    wrap.innerHTML=`<div class="modal-img-placeholder"><div class="mpi">🖼️</div><span>Sin foto</span></div>${closeBtn}`;
  }
  document.getElementById('mCat').textContent=p.category||'';
  document.getElementById('mName').textContent=p.name;
  document.getElementById('mDesc').textContent=p.description||'';
  document.getElementById('mPrice').textContent='$'+parseFloat(p.price||0).toLocaleString('es-MX',{minimumFractionDigits:2});
  const isOut=!p.stock||p.stock==0;
  const isLow=p.stock>0&&p.stock<=(p.minStock||5);
  document.getElementById('mStock').textContent=isOut?'⚠ Agotado':isLow?`⚡ Últimas ${p.stock} piezas`:`✓ Disponible (${p.stock} pzs)`;
  document.getElementById('mSku').textContent=p.sku?`SKU: ${p.sku}`:'';
  document.getElementById('mLoc').textContent=p.location?`📍 ${p.location}`:'';
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow='';
}
function handleOverlayClick(e){if(e.target.id==='modalOverlay')closeModal()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script>
</body>
</html>
